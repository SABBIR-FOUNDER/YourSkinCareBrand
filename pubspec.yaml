name: your_skin_care_brand
description: Native YourSkinCareBrand customer storefront.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  flutter_secure_storage: ^9.2.4
  go_router: ^16.3.0
  dio: ^5.8.0+1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
